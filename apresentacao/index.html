                            <div className="p-4 border rounded-xl">
                                <span className="font-bold block text-xl mb-2 text-brand-blue">Aggregate Roots</span>
                                <ul className="list-disc pl-5"><li>Usuario</li><li>Disciplina</li><li>Topico</li><li>SessaoEstudo</li></ul>

                            <div className="p-4 border rounded-xl">

                        &nbsp;&nbsp;&nbsp;&nbsp;value-objects/&nbsp;← Coordenada<br/>
                        &nbsp;&nbsp;&nbsp;&nbsp;repositories/&nbsp;&nbsp;← Interfaces puras<br/>
                        &nbsp;&nbsp;&nbsp;&nbsp;gateways/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← Interfaces puras<br/>
                        &nbsp;&nbsp;application/<br/>
                        &nbsp;&nbsp;&nbsp;&nbsp;use-cases/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← Orquestração (RegistrarSessaoUseCase)<br/>
                        &nbsp;&nbsp;adapters/<br/>
                        &nbsp;&nbsp;&nbsp;&nbsp;screens/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← Expo Router UI<br/>
                        &nbsp;&nbsp;&nbsp;&nbsp;gateways/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← CameraGatewayExpo, AuthSupa<br/>
                        &nbsp;&nbsp;infra/<br/>
                        &nbsp;&nbsp;&nbsp;&nbsp;db/&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← schema.ts (Drizzle)<br/>

                    </div>
                )

                content: (
                    <div className="flex flex-col justify-center h-full max-w-5xl mx-auto w-full">

                        <div className="flex items-end gap-2 h-72 border-b-4 border-gray-300 pb-2">
                            <div className="bg-brand-blue flex-1 h-full rounded-t-xl flex items-center justify-center text-white font-bold text-center flex-col p-2 shadow-lg">
                                <span className="text-3xl">Muitos</span>
                                <span className="text-sm font-normal mt-2">Domínio (puro, s/ mock)</span>
                            </div>
                            <div className="bg-brand-green flex-1 h-[80%] rounded-t-xl flex items-center justify-center text-white font-bold text-center flex-col p-2 shadow-lg">
                                <span className="text-2xl">Muitos</span>
                                <span className="text-sm font-normal mt-2">Use Cases (fakes memory)</span>
                            </div>
                            <div className="bg-brand-yellow flex-1 h-[60%] rounded-t-xl flex items-center justify-center text-gray-800 font-bold text-center flex-col p-2 shadow-lg">
                                <span className="text-xl">Médios</span>
                                <span className="text-sm font-normal mt-2">Gateways/Repos (mock/SQLite)</span>

                            <div className="bg-brand-orange flex-1 h-[40%] rounded-t-xl flex items-center justify-center text-white font-bold text-center flex-col p-2 shadow-lg">
                                <span>Poucos</span>
                                <span className="text-xs font-normal mt-1">Componentes UI (react-native)</span>
                            </div>
                            <div className="bg-brand-coral flex-1 h-[20%] rounded-t-xl flex items-center justify-center text-white font-bold text-center flex-col p-2 shadow-lg">
                                <span className="text-xs font-normal">E2E (Maestro)</span>
                            </div>
                        </div>
                        <div className="mt-6 text-sm text-gray-800 bg-gray-100 p-4 rounded-xl text-center border border-gray-300">
                            <strong>Destaque na Apresentação:</strong> Explicar que hardware (GPS/Câmera) nunca é acionado em testes unitários rápidos. Injetamos versões "Fakes" (em memória) para testar 100% das lógicas dos Use Cases em milissegundos.
                        </div>
                    </div>
                )
            },
            {
                id: "rastreabilidade", section: "Bloco 7", title: "Matriz de Rastreabilidade",
                theme: "black",
                content: (
                    <div className="bg-white p-8 squircle shadow-sm h-full flex flex-col">
                        <h2 className="text-4xl font-bold mb-6">Da Demanda ao Teste (RF → UC → Teste)</h2>
                        <div className="flex-1 overflow-x-auto">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead><tr className="border-b-2 border-gray-300"><th className="pb-3 px-2">RF (Requisito Funcional)</th><th className="pb-3 px-2">Caso de Uso</th><th className="pb-3 px-2">Teste de Aceitação Planejado</th></tr></thead>
                                <tbody className="divide-y divide-gray-100 text-gray-700">
                                    <tr><td className="py-3 px-2 font-bold text-black">RF01 (Cadastro)</td><td className="py-3 px-2">UC01 Fazer Cadastro</td><td className="py-3 px-2 font-mono text-xs bg-gray-50 rounded">AutenticarUsuarioUseCase.test.ts</td></tr>
                                    <tr><td className="py-3 px-2 font-bold text-black">RF05 (CRUD)</td><td className="py-3 px-2">UC04 Gerenciar Disciplinas</td><td className="py-3 px-2 font-mono text-xs bg-gray-50 rounded">CadastrarDisciplinaUseCase.test.ts</td></tr>
                                    <tr><td className="py-3 px-2 font-bold text-black">RF07 (IA Resumo)</td><td className="py-3 px-2">UC06 Gerar Resumo via IA</td><td className="py-3 px-2 font-mono text-xs bg-gray-50 rounded">GerarResumoUseCase.test.ts</td></tr>
                                    <tr><td className="py-3 px-2 font-bold text-black">RF11 (Sessão)</td><td className="py-3 px-2">UC08 Registrar Sessão</td><td className="py-3 px-2 font-mono text-xs bg-gray-50 rounded">RegistrarSessaoUseCase.test.ts</td></tr>
                                    <tr><td className="py-3 px-2 font-bold text-black">RF13 (GPS)</td><td className="py-3 px-2">UC08 (Localização)</td><td className="py-3 px-2 font-mono text-xs bg-gray-50 rounded">Mock LocationGateway em UC08</td></tr>
                                    <tr><td className="py-3 px-2 font-bold text-black">RF20 (Sync)</td><td className="py-3 px-2">UC14 Sincronizar Fila</td><td className="py-3 px-2 font-mono text-xs bg-gray-50 rounded">SincronizarFilaUseCase.test.ts</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                )
            },
            {
                id: "cronograma", section: "Bloco 7", title: "Cronograma Executivo (60h)",
                theme: "black",
                content: (
                    <div className="flex flex-col h-full w-full justify-center">
                        <h2 className="text-4xl font-bold mb-8">Roadmap de Sprints (~6h/cada)</h2>
                        <div className="grid grid-cols-2 gap-6 text-lg">
                            <div className="bg-white p-5 rounded-2xl border-l-8 border-gray-400 shadow-sm"><span className="font-bold text-gray-800">Sprint 0:</span> Setup Infra (Expo/DB/Supabase)</div>
                            <div className="bg-white p-5 rounded-2xl border-l-8 border-brand-blue shadow-sm"><span className="font-bold text-gray-800">Sprint 1-2:</span> TDD Domínio e Use Cases</div>
                            <div className="bg-white p-5 rounded-2xl border-l-8 border-brand-green shadow-sm"><span className="font-bold text-gray-800">Sprint 3-5:</span> Adapters (Auth/Repos/Gateways nativos)</div>
                            <div className="bg-white p-5 rounded-2xl border-l-8 border-brand-yellow shadow-sm"><span className="font-bold text-gray-800">Sprint 6:</span> Construção da Sync Engine</div>
                            <div className="bg-white p-5 rounded-2xl border-l-8 border-brand-orange shadow-sm"><span className="font-bold text-gray-800">Sprint 7-9:</span> Front-end UI (Telas e Integrações)</div>
                            <div className="bg-white p-5 rounded-2xl border-l-8 border-brand-coral shadow-sm"><span className="font-bold text-gray-800">Sprint 10:</span> Polimento E2E e Lançamento</div>
                        </div>
                    </div>
                )
            },
            {
                id: "fim", section: "Fechamento", title: "StudyRats",
                theme: "blue",
                content: (
                    <div className="flex flex-col items-center justify-center h-full text-center space-y-8">
                        <div className="w-40 h-40 bg-brand-blue rounded-3xl rotate-12 flex items-center justify-center shadow-xl">
                            <i data-lucide="graduation-cap" className="w-20 h-20 text-white -rotate-12"></i>
                        </div>
                        <h1 className="text-6xl font-extrabold text-brand-blue">Obrigada!</h1>
                        <p className="text-3xl font-medium text-gray-600">Perguntas da Banca?</p>
                        <p className="text-xl text-gray-400 font-medium">Maria Clara Miguel & Sthefany Bueno</p>
                    </div>
                )
            }
        ];

        // MAPA DE CORES
        const themes = {
            blue: "bg-brand-blueLight text-brand-blue",
            green: "bg-brand-greenLight text-brand-green",
            orange: "bg-brand-orangeLight text-brand-orange",
            purple: "bg-brand-purpleLight text-brand-purple",
            yellow: "bg-brand-yellowLight text-yellow-800",
            coral: "bg-brand-coralLight text-brand-coral",
            black: "bg-gray-200 text-gray-800"
        };
        const activeTheme = {
            blue: "bg-brand-blue text-white",
            green: "bg-brand-green text-white",
            orange: "bg-brand-orange text-white",
            purple: "bg-brand-purple text-white",
            yellow: "bg-brand-yellow text-black",
            coral: "bg-brand-coral text-white",
            black: "bg-brand-black text-white"
        };

        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === "ArrowRight") next();
                    if (e.key === "ArrowLeft") prev();
                };
                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [currentSlide]);

            const next = () => setCurrentSlide(prev => Math.min(prev + 1, slides.length - 1));
            const prev = () => setCurrentSlide(prev => Math.max(prev - 1, 0));

            const slide = slides[currentSlide];

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div className="min-h-screen w-full flex flex-col font-sans text-brand-black relative">
                    {/* Progress Bar Fixa */}
                    <div className="fixed top-0 left-0 h-2 w-full bg-gray-200 z-50">
                        <div className="h-full bg-brand-blue transition-all duration-300 ease-out" style={{ width: `${((currentSlide + 1) / slides.length) * 100}%` }}></div>
                    </div>

                    <div className="flex-1 flex w-full relative pt-12 pb-12">
                        
                        {/* SIDEBAR (Drawer) */}
                        <div className={`fixed top-0 left-0 h-full w-96 bg-white border-r border-gray-200 shadow-2xl z-50 transform transition-transform duration-300 ${menuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="p-6 flex items-center justify-between border-b border-gray-100">
                                <h2 className="font-bold text-2xl flex items-center gap-2"><i data-lucide="list" style={{width: 24, height: 24}}></i> Índice</h2>
                                <button onClick={() => setMenuOpen(false)} className="p-3 bg-gray-100 rounded-full hover:bg-gray-200 transition"><i data-lucide="x" style={{width: 20, height: 20}}></i></button>
                            </div>
                            <div className="p-4 overflow-y-auto h-[calc(100%-90px)] space-y-2">
                                {slides.map((s, idx) => (
                                    <button 
                                        key={s.id} 
                                        onClick={() => { setCurrentSlide(idx); setMenuOpen(false); }}
                                        className={`w-full text-left p-4 rounded-2xl text-md font-medium transition flex items-start gap-3 ${currentSlide === idx ? activeTheme[s.theme] + " shadow-md" : 'hover:bg-gray-100 text-gray-700'}`}
                                    >
                                        <span className={`font-bold ${currentSlide === idx ? 'opacity-80' : 'text-gray-400'}`}>{String(idx + 1).padStart(2, '0')}.</span>
                                        <span className="leading-tight">{s.title}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* MAIN CONTENT */}
                        <div className="flex-1 flex flex-col items-center p-8 bg-brand-bg relative min-h-full">
                            
                            {/* Header flutuante para menus */}
                            <div className="w-full max-w-7xl px-4 flex justify-between items-center z-10 mb-8">
                                <button onClick={() => setMenuOpen(true)} className="bg-white px-6 py-3 rounded-full shadow-sm flex items-center gap-3 font-bold border border-gray-200 hover:bg-gray-50 hover:shadow-md transition">
                                    <i data-lucide="list" style={{width: 20, height: 20}}></i> Ver Índice
                                </button>
                                <div className={`px-6 py-2 rounded-full text-md font-bold uppercase tracking-wider ${themes[slide.theme]}`}>
                                    {slide.section}
                                </div>
                            </div>

                            {/* Slide Canvas Flúido */}
                            <div className="w-full max-w-7xl flex flex-col flex-1 relative mb-8">
                                <div className="slide-container w-full h-full" key={slide.id}>
                                    {slide.content}
                                </div>
                            </div>

                            {/* Nav Controls integrados ao fluxo da página */}
                            <div className="flex items-center gap-6 mt-12 mb-8">
                                <button onClick={prev} disabled={currentSlide === 0} className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg disabled:opacity-30 hover:bg-gray-50 hover:scale-105 transition-all border border-gray-200 text-gray-600">
                                    <i data-lucide="chevron-left" style={{width: 32, height: 32}}></i>
                                </button>
                                <span className="font-bold text-gray-400 w-24 text-center text-xl">{currentSlide + 1} / {slides.length}</span>
                                <button onClick={next} disabled={currentSlide === slides.length - 1} className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg disabled:opacity-30 hover:bg-gray-50 hover:scale-105 transition-all border border-gray-200 text-gray-600">
                                    <i data-lucide="chevron-right" style={{width: 32, height: 32}}></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        window.DiagramViewer = DiagramViewer;
        root.render(<App />);
    </script>
</body>
