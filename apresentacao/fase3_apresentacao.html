  private constructor(private readonly props: Required<CoordenadaProps>) {}

  public static create(props: CoordenadaProps): Coordenada {
    // Invariante DDD: Limites do globo terrestre
    if (props.latitude < -90 || props.latitude > 90) {
      throw new Error('Latitude inválida');
    }
    if (props.longitude < -180 || props.longitude > 180) {
      throw new Error('Longitude inválida');
    }
    return new Coordenada({
      latitude: props.latitude,
      longitude: props.longitude,
      timestamp: props.timestamp ?? new Date(),
    });
  }
}`}

                                code={`async execute(request: RegistrarSessaoRequest): Promise<RegistrarSessaoResponse> {
  // 1. Validar usuário existente
  const usuario = await this.usuarioRepository.buscarPorId(request.usuarioId);
  if (!usuario) return { isSuccess: false, error: 'Usuário não encontrado' };

  // 2. GPS como evidência opcional (não bloqueante)
  const coordenada = request.anexarGps ? await this.obterCoordenada() : undefined;

  // 3. Criar entidade raiz SessaoEstudo
  const sessao = SessaoEstudo.create({
    usuarioId: request.usuarioId,
    duracaoMinutos: request.duracaoMinutos,
    coordenada,
  });

  // 4. Anexar Foto (reaproveita pré-captura ou aciona câmera)
  if (request.comFoto) {
    const uriLocal = request.fotoUri ?? (await this.cameraGateway.capturarFoto());
    if (uriLocal) {
      sessao.anexarFoto(FotoSessao.create({ sessaoId: sessao.id, uriLocal }));
    }
  }

  // 5. Atribuir XP e persistir agregados
  usuario.adicionarXP(request.duracaoMinutos);
  await this.sessaoRepository.salvar(sessao);
  await this.usuarioRepository.salvar(usuario);

  return { isSuccess: true, value: sessao };
}`}

                        </div>

                        <div className="p-6 bg-white rounded-3xl border border-gray-200 max-w-2xl text-base text-gray-700 leading-relaxed shadow-sm">
                            <em>"O software demonstrou na prática que a complexidade de hardware e bancos de dados pode ser domada com princípios sólidos de Clean Architecture e testes herméticos."</em>
                        </div>

                        <div className="pt-4 border-t border-gray-200 w-full max-w-md">
                            <p className="text-lg font-bold text-gray-900">Perguntas & Respostas</p>
                            <p className="text-sm text-gray-500">Obrigado pela atenção!</p>
                        </div>
                    </div>
                )
            }
        ];

        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(600); // 10 minutos
            const [timerRunning, setTimerRunning] = useState(false);

            useEffect(() => {
                let interval = null;
                if (timerRunning && timerSeconds > 0) {
                    interval = setInterval(() => setTimerSeconds(prev => prev - 1), 1000);
                } else if (timerSeconds === 0) {
                    setTimerRunning(false);
                }
                return () => clearInterval(interval);
            }, [timerRunning, timerSeconds]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            const prev = () => setCurrentSlide(p => Math.max(0, p - 1));
            const next = () => setCurrentSlide(p => Math.min(slides.length - 1, p + 1));

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                        next();
                    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                        prev();
                    } else if (e.key === 't' || e.key === 'T') {
                        setTimerRunning(r => !r);
                    } else if (e.key === 'm' || e.key === 'M') {
                        setMenuOpen(o => !o);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [currentSlide, menuOpen]);

            const slide = slides[currentSlide];

            const themeColors = {
                blue: "bg-brand-blueLight text-brand-blue border-brand-blue/30",
                coral: "bg-brand-coralLight text-brand-coral border-brand-coral/30",
                green: "bg-brand-greenLight text-brand-green border-brand-green/30",
                purple: "bg-brand-purpleLight text-brand-purple border-brand-purple/30",
                orange: "bg-brand-orangeLight text-brand-orange border-brand-orange/30",
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-200 px-6 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button 
                                onClick={() => setMenuOpen(true)} 
                                className="p-2.5 rounded-xl hover:bg-gray-100 text-gray-700 transition flex items-center gap-2 font-bold text-sm"
                                title="Abrir Índice (Atalho: M)"
                            >
                                <i data-lucide="menu" className="w-5 h-5"></i>
                                <span className="hidden sm:inline">Índice</span>
                            </button>
                            <div className="h-6 w-px bg-gray-200 hidden sm:block"></div>
                            <span className="font-extrabold text-lg text-brand-black tracking-tight hidden sm:inline">
                                Study<span className="text-brand-blue">Rats</span> <span className="text-xs text-gray-400 font-semibold ml-1">Fase 3</span>
                            </span>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-2 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
                                <i data-lucide="clock" className={`w-4 h-4 ${timerSeconds < 120 ? 'text-red-500 animate-pulse' : 'text-gray-500'}`}></i>
                                <span className={`font-mono text-xs font-bold ${timerSeconds < 120 ? 'text-red-600' : 'text-gray-700'}`}>
                                    {formatTime(timerSeconds)}
                                </span>
                                <button 
                                    onClick={() => setTimerRunning(!timerRunning)} 
                                    className="p-1 hover:bg-gray-200 rounded-full transition"
                                    title="Pausar/Iniciar Cronômetro (Atalho: T)"
                                >
                                    <i data-lucide={timerRunning ? "pause" : "play"} className="w-3.5 h-3.5 text-gray-600"></i>
                                </button>
                                <button 
                                    onClick={() => { setTimerRunning(false); setTimerSeconds(600); }} 
                                    className="p-1 hover:bg-gray-200 rounded-full transition"
                                    title="Reiniciar Timer"
                                >
                                    <i data-lucide="rotate-ccw" className="w-3.5 h-3.5 text-gray-400"></i>
                                </button>
                            </div>

                            <span className={`text-xs font-bold px-3 py-1.5 rounded-full border ${themeColors[slide.theme]}`}>
                                {slide.section}
                            </span>
                        </div>
                    </header>

                    <div className="w-full bg-gray-200 h-1">
                        <div 
                            className="bg-brand-blue h-1 transition-all duration-300"
                            style={{ width: `${((currentSlide + 1) / slides.length) * 100}%` }}
                        ></div>
                    </div>

                    {menuOpen && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex">
                            <div className="w-96 bg-white h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
                                <div>
                                    <div className="flex items-center justify-between pb-4 border-b border-gray-200 mb-4">
                                        <h3 className="font-extrabold text-xl text-gray-900 flex items-center gap-2">
                                            <i data-lucide="list-ordered" className="w-5 h-5 text-brand-blue"></i> Roteiro de 10 min
                                        </h3>
                                        <button onClick={() => setMenuOpen(false)} className="p-2 rounded-full hover:bg-gray-100">
                                            <i data-lucide="x" className="w-5 h-5 text-gray-600"></i>
                                        </button>
                                    </div>
                                    <div className="space-y-1.5">
                                        {slides.map((s, idx) => (
                                            <button
                                                key={s.id}
                                                onClick={() => { setCurrentSlide(idx); setMenuOpen(false); }}
                                                className={`w-full text-left p-3 rounded-xl text-sm font-semibold transition flex items-center justify-between ${currentSlide === idx ? 'bg-brand-blue text-white shadow-md' : 'hover:bg-gray-100 text-gray-700'}`}
                                            >
                                                <div className="flex items-center gap-2.5 truncate">
                                                    <span className={`text-xs font-mono ${currentSlide === idx ? 'text-white/80' : 'text-gray-400'}`}>
                                                        {String(idx + 1).padStart(2, '0')}
                                                    </span>
                                                    <span className="truncate">{s.title}</span>
                                                </div>
                                                <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full shrink-0 ml-2 ${currentSlide === idx ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-500'}`}>
                                                    {s.tempoRecomendado}
                                                </span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="pt-4 border-t border-gray-100 text-xs text-gray-400 text-center">
                                    Atalhos: ←/→ (Navegar) | T (Timer) | M (Menu)
                                </div>
                            </div>
                            <div className="flex-1" onClick={() => setMenuOpen(false)}></div>
                        </div>
                    )}

                    <main className="flex-1 flex flex-col justify-center px-6 py-8 max-w-7xl mx-auto w-full">
                        <div className="slide-container" key={slide.id}>
                            {slide.content}
                        </div>
                    </main>

                    <footer className="sticky bottom-0 bg-white/95 backdrop-blur-md border-t border-gray-200 px-6 py-4 flex items-center justify-between z-30">
                        <div className="text-xs text-gray-500 flex items-center gap-2">
                            <span className="font-bold text-gray-800">{slide.title}</span>
                            <span>•</span>
                            <span>Tempo sugerido: <strong>{slide.tempoRecomendado} min</strong></span>
                        </div>

                        <div className="flex items-center gap-4">
                            <button 
                                onClick={prev} 
                                disabled={currentSlide === 0}
                                className="px-5 py-2.5 rounded-full bg-white border border-gray-200 shadow-sm hover:bg-gray-50 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-2 text-sm font-bold text-gray-700"
                            >
                                <i data-lucide="chevron-left" className="w-4 h-4"></i> Anterior
                            </button>

                            <span className="text-sm font-bold text-gray-600 font-mono">
                                {currentSlide + 1} <span className="text-gray-300">/</span> {slides.length}
                            </span>

                            <button 
                                onClick={next} 
                                disabled={currentSlide === slides.length - 1}
                                className="px-6 py-2.5 rounded-full bg-brand-blue text-white shadow-md hover:bg-brand-blue/90 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-2 text-sm font-bold"
                            >
                                Próximo <i data-lucide="chevron-right" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
